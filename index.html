<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>아롱이와 다롱이의 성별은..?</title>
    <!-- 폭죽 애니메이션(canvas-confetti) 라이브러리 -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background: linear-gradient(180deg, #fce4ec 0%, #f3e5f5 50%, #e8eaf6 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* 1. 동적 배경 풍선 컨테이너 */
        .balloon-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
            pointer-events: none;
        }

        .bg-balloon {
            position: absolute;
            bottom: -150px;
            border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
            opacity: 0.7;
            animation: floatUp linear forwards;
        }

        .bg-balloon::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 4px solid transparent;
            border-right: 4px solid transparent;
            border-bottom: 8px solid inherit;
        }

        /* 풍선 실 */
        .bg-balloon::before {
            content: '';
            position: absolute;
            bottom: -28px;
            left: 50%;
            width: 1.5px;
            height: 20px;
            background: rgba(0, 0, 0, 0.15);
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) rotate(0deg);
            }
            100% {
                transform: translateY(-125vh) rotate(25deg);
            }
        }

        /* 카드 메인 컨테이너 */
        .card-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 420px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* 메인 풍선 버튼 (기본 state) */
        .balloon-btn {
            width: 310px;
            height: 370px;
            background: linear-gradient(135deg, #fef2f2 0%, #fce7f3 100%);
            border-radius: 50% 50% 50% 50% / 45% 45% 55% 55%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 20px 40px rgba(160, 130, 180, 0.25), inset -12px -12px 25px rgba(255, 255, 255, 0.8);
            cursor: pointer;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), background 0.4s ease, box-shadow 0.4s ease;
            position: relative;
            padding: 30px;
            text-align: center;
            border: 4px solid rgba(255, 255, 255, 0.6);
        }

        /* 터졌을 때 (진하고 선명한 하늘색 적용) */
        .balloon-btn.revealed {
            background: linear-gradient(135deg, #00b4db 0%, #0083b0 100%);
            box-shadow: 0 20px 45px rgba(0, 131, 176, 0.45), inset -12px -12px 25px rgba(255, 255, 255, 0.4);
            border-color: rgba(255, 255, 255, 0.9);
        }

        /* 터졌을 때 꼬리 색상 변경 */
        .balloon-btn.revealed .balloon-tail {
            border-bottom-color: #0083b0;
        }

        .balloon-btn:active {
            transform: scale(0.95);
        }

        /* 풍선 꼬리 연출 */
        .balloon-tail {
            position: absolute;
            bottom: -18px;
            width: 0;
            height: 0;
            border-left: 14px solid transparent;
            border-right: 14px solid transparent;
            border-bottom: 20px solid #fbcfe8;
            transition: border-bottom-color 0.4s ease;
        }

        .title-text {
            font-size: 26px;
            font-weight: 800;
            color: #4a3b5c;
            line-height: 1.5;
            word-break: keep-all;
            transition: color 0.4s ease;
        }

        /* 공개 화면 (결과 연출) */
        .reveal-content {
            display: none;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: 10px;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .emoji {
            font-size: 48px;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.2));
        }

        @keyframes popIn {
            0% { transform: scale(0.3); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* 하단 안내 캡슐 */
        .hint-capsule {
            margin-top: 40px;
            background: rgba(255, 255, 255, 0.9);
            padding: 12px 28px;
            border-radius: 30px;
            font-size: 15px;
            font-weight: 700;
            color: #5c4a6e;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.06);
            backdrop-filter: blur(5px);
        }
    </style>
</head>
<body>

    <!-- 자바스크립트로 풍선이 무한 생성되는 컨테이너 -->
    <div class="balloon-container" id="balloonContainer"></div>

    <div class="card-wrapper">
        <div class="balloon-btn" id="balloonBtn" onclick="toggleReveal(event)">
            <!-- 질문 텍스트 -->
            <div class="title-text" id="questionText">
                아롱이와 다롱이의<br>성별은..?
            </div>

            <!-- 성별 공개 이모지 (보라색 하트 💜 및 남자아이 2명 👦🏻 👦🏻) -->
            <div class="reveal-content" id="revealContent">
                <span class="emoji">💜</span>
                <span class="emoji">👦🏻</span>
                <span class="emoji">👦🏻</span>
                <span class="emoji">💜</span>
            </div>

            <div class="balloon-tail"></div>
        </div>

        <div class="hint-capsule">
            풍선을 톡 눌러주세요
        </div>
    </div>

    <script>
        // 무한 초고속 배경 풍선 생성 스크립트
        const colors = ['#ff7b9c', '#85e3ff', '#b9b0ff', '#baffc9', '#ffb3ba', '#ffd97d'];

        function createBgBalloon() {
            const container = document.getElementById('balloonContainer');
            if (!container) return;

            const balloon = document.createElement('div');
            balloon.classList.add('bg-balloon');

            // 무작위 위치, 크기, 색상, 매우 빠른 속도(0.8초~1.5초) 부여
            const randomColor = colors[Math.floor(Math.random() * colors.length)];
            const randomX = Math.random() * 100; // 가로 위치 (0~100%)
            const randomSize = Math.floor(Math.random() * 35) + 45; // 크기 45px ~ 80px
            const randomDuration = Math.random() * 0.7 + 0.8; // 속도 0.8초 ~ 1.5초

            balloon.style.left = randomX + '%';
            balloon.style.background = randomColor;
            balloon.style.width = randomSize + 'px';
            balloon.style.height = (randomSize * 1.25) + 'px';
            balloon.style.animationDuration = randomDuration + 's';

            container.appendChild(balloon);

            // 애니메이션이 끝나면 메모리에서 DOM 요소 제거
            setTimeout(() => {
                balloon.remove();
            }, randomDuration * 1000);
        }

        // 0.12초마다 풍선을 지속 생성
        setInterval(createBgBalloon, 120);

        function toggleReveal(e) {
            const btn = document.getElementById('balloonBtn');
            const qText = document.getElementById('questionText');
            const rContent = document.getElementById('revealContent');

            if (rContent.style.display === 'flex') {
                rContent.style.display = 'none';
                qText.style.display = 'block';
                btn.classList.remove('revealed'); // 원래 색상 복구
            } else {
                qText.style.display = 'none';
                rContent.style.display = 'flex';
                btn.classList.add('revealed'); // 진한 하늘색으로 변환

                // 풍선을 터뜨렸을 때 폭죽(컨페티) 효과 연출
                triggerConfetti();
            }
        }

        function triggerConfetti() {
            var count = 200;
            var defaults = {
                origin: { y: 0.6 }
            };

            function fire(particleRatio, opts) {
                confetti(Object.assign({}, defaults, opts, {
                    particleCount: Math.floor(count * particleRatio)
                }));
            }

            fire(0.25, {
                spread: 26,
                startVelocity: 55,
            });
            fire(0.2, {
                spread: 60,
            });
            fire(0.35, {
                spread: 100,
                decay: 0.91,
                scalar: 0.8
            });
            fire(0.1, {
                spread: 120,
                startVelocity: 25,
                decay: 0.92,
                scalar: 1.2
            });
            fire(0.1, {
                spread: 120,
                startVelocity: 45,
            });
        }
    </script>
</body>
</html>
