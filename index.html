<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>아롱이와 다롱이의 공개 페이지</title>
    <style>
        :root {
            --primary-color: #ff7b9c;
            --secondary-color: #ffaebc;
            --bg-color: #fff5f7;
            --card-bg: #ffffff;
            --text-color: #4a4a4a;
            --accent-color: #6c5ce7;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: var(--card-bg);
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(255, 123, 156, 0.15);
            max-width: 480px;
            width: 100%;
            padding: 40px 28px;
            text-align: center;
            position: relative;
            overflow: hidden;
            border: 2px solid #ffe3e8;
        }

        .badge {
            display: inline-block;
            background: var(--secondary-color);
            color: #fff;
            font-weight: 700;
            font-size: 14px;
            padding: 6px 16px;
            border-radius: 20px;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }

        h1 {
            color: #ff477e;
            font-size: 26px;
            margin-bottom: 12px;
            word-break: keep-all;
        }

        p.subtitle {
            font-size: 15px;
            color: #7f8c8d;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .reveal-box {
            background: #fff0f3;
            border-radius: 18px;
            padding: 30px 20px;
            margin-bottom: 30px;
            border: 2px dashed var(--primary-color);
            transition: all 0.5s ease;
        }

        .char-container {
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin-top: 15px;
        }

        .character {
            flex: 1;
            padding: 10px;
        }

        .avatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: #ffe3e8;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
            margin: 0 auto 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            border: 3px solid #fff;
        }

        .char-name {
            font-size: 18px;
            font-weight: bold;
            color: #ff477e;
            margin-bottom: 4px;
        }

        .char-desc {
            font-size: 13px;
            color: #666;
        }

        .vs-badge {
            font-weight: 900;
            color: var(--primary-color);
            font-size: 20px;
            font-style: italic;
        }

        .btn {
            background: linear-gradient(135deg, #ff7b9c 0%, #ff477e 100%);
            color: white;
            border: none;
            padding: 16px 32px;
            font-size: 17px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 6px 20px rgba(255, 71, 126, 0.3);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 71, 126, 0.4);
        }

        .btn:active {
            transform: translateY(1px);
        }

        .secret-message {
            display: none;
            margin-top: 25px;
            padding: 20px;
            background: #f0f3ff;
            border-radius: 16px;
            border: 1px solid #d0d7de;
            animation: fadeIn 0.6s ease-in-out forwards;
        }

        .secret-message h3 {
            color: var(--accent-color);
            margin-bottom: 8px;
            font-size: 18px;
        }

        .secret-message p {
            font-size: 14px;
            color: #555;
            line-height: 1.6;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <span class="badge">SPECIAL REVEAL</span>
        <h1>아롱이 & 다롱이 비밀 공개!</h1>
        <p class="subtitle">궁금했던 아롱이와 다롱이의 이야기,<br>아래 버튼을 눌러 확인해보세요!</p>

        <div class="reveal-box">
            <div class="char-container">
                <div class="character">
                    <div class="avatar">🐶</div>
                    <div class="char-name">아롱이</div>
                    <div class="char-desc">귀여운 호기심 대장</div>
                </div>
                <div class="vs-badge">&</div>
                <div class="character">
                    <div class="avatar">🐱</div>
                    <div class="char-name">다롱이</div>
                    <div class="char-desc">애교 만점 장난꾸러기</div>
                </div>
            </div>
        </div>

        <button class="btn" onclick="revealSecret()">비밀 확인하기 ✨</button>

        <div class="secret-message" id="secretMessage">
            <h3>🎉 아롱이와 다롱이는 절친입니다!</h3>
            <p>언제나 함께 티격태격하며 즐거운 추억을 만들어가는 아롱이와 다롱이의 특별한 이야기를 기대해주세요!</p>
        </div>
    </div>

    <script>
        function revealSecret() {
            const secretMsg = document.getElementById('secretMessage');
            if (secretMsg.style.display === 'block') {
                secretMsg.style.display = 'none';
            } else {
                secretMsg.style.display = 'block';
                secretMsg.scrollIntoView({ behavior: 'smooth' });
            }
        }
    </script>
</body>
</html>
