<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>아롱이와 다롱이의 성별은..?</title>
    <!-- 폭죽 애니메이션(canvas-confetti) 라이브러리 -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background: linear-gradient(180deg, #fce4ec 0%, #f3e5f5 50%, #e8eaf6 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* 1. 배경 풍선이 아래에서 위로 올라가는 애니메이션 */
        .balloon-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
            pointer-events: none;
        }

        .bg-balloon {
            position: absolute;
            bottom: -150px;
            width: 60px;
            height: 75px;
            border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
            opacity: 0.7;
            animation: floatUp linear infinite;
        }

        .bg-balloon::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 4px solid transparent;
            border-right: 4px solid transparent;
            border-bottom: 8px solid inherit;
        }

        /* 풍선 실 */
        .bg-balloon::before {
            content: '';
            position: absolute;
            bottom: -30px;
            left: 50%;
            width: 2px;
            height: 22px;
            background: rgba(0, 0, 0, 0.15);
        }

        /* 풍선 대량 배치 및 빠른 속도 설정 */
        .b1  { left: 3%;  background: #ff7b9c; animation-duration: 3.2s; animation-delay: 0s; }
        .b2  { left: 10%; background: #85e3ff; animation-duration: 2.5s; animation-delay: 1.2s; width: 75px; height: 90px; }
        .b3  { left: 17%; background: #b9b0ff; animation-duration: 3.8s; animation-delay: 0.5s; }
        .b4  { left: 24%; background: #baffc9; animation-duration: 2.8s; animation-delay: 2.1s; width: 55px; height: 70px; }
        .b5  { left: 31%; background: #ffb3ba; animation-duration: 3.0s; animation-delay: 0.8s; }
        .b6  { left: 38%; background: #ffd97d; animation-duration: 2.3s; animation-delay: 1.5s; width: 70px; height: 85px; }
        .b7  { left: 45%; background: #ff7b9c; animation-duration: 3.5s; animation-delay: 0.2s; }
        .b8  { left: 52%; background: #85e3ff; animation-duration: 2.7s; animation-delay: 1.8s; width: 65px; height: 80px; }
        .b9  { left: 59%; background: #b9b0ff; animation-duration: 3.1s; animation-delay: 0.9s; }
        .b10 { left: 66%; background: #baffc9; animation-duration: 2.4s; animation-delay: 0.4s; width: 80px; height: 95px; }
        .b11 { left: 73%; background: #ffb3ba; animation-duration: 3.6s; animation-delay: 2.3s; }
        .b12 { left: 80%; background: #ffd97d; animation-duration: 2.6s; animation-delay: 1.1s; width: 60px; height: 75px; }
        .b13 { left: 87%; background: #ff7b9c; animation-duration: 3.3s; animation-delay: 0.6s; }
        .b14 { left: 94%; background: #85e3ff; animation-duration: 2.9s; animation-delay: 1.6s; width: 70px; height: 85px; }

        @keyframes floatUp {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0.75;
            }
            100% {
                transform: translateY(-120vh) rotate(15deg);
                opacity: 0.2;
            }
        }

        /* 카드 메인 컨테이너 */
        .card-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 420px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* 메인 풍선 버튼 */
        .balloon-btn {
            width: 310px;
            height: 370px;
            background: linear-gradient(135deg, #e0f2fe 0%, #fce7f3 100%);
            border-radius: 50% 50% 50% 50% / 45% 45% 55% 55%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 20px 40px rgba(160, 130, 180, 0.25), inset -12px -12px 25px rgba(255, 255, 255, 0.8);
            cursor: pointer;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            padding: 30px;
            text-align: center;
            border: 4px solid rgba(255, 255, 255, 0.6);
        }

        .balloon-btn:active {
            transform: scale(0.95);
        }

        /* 풍선 꼬리 연출 */
        .balloon-tail {
            position: absolute;
            bottom: -18px;
            width: 0;
            height: 0;
            border-left: 14px solid transparent;
            border-right: 14px solid transparent;
            border-bottom: 20px solid #fbcfe8;
        }

        .title-text {
            font-size: 26px;
            font-weight: 800;
            color: #4a3b5c;
            line-height: 1.5;
            word-break: keep-all;
        }

        /* 공개 화면 (결과 연출) */
        .reveal-content {
            display: none;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: 10px;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .emoji {
            font-size: 48px;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.1));
        }

        @keyframes popIn {
            0% { transform: scale(0.3); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* 하단 안내 캡슐 */
        .hint-capsule {
            margin-top: 40px;
            background: rgba(255, 255, 255, 0.9);
            padding: 12px 28px;
            border-radius: 30px;
            font-size: 15px;
            font-weight: 700;
            color: #5c4a6e;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.06);
            backdrop-filter: blur(5px);
        }
    </style>
</head>
<body>

    <!-- 아래에서 위로 올라가는 배경 풍선들 (수정됨) -->
    <div class="balloon-container">
        <div class="bg-balloon b1"></div>
        <div class="bg-balloon b2"></div>
        <div class="bg-balloon b3"></div>
        <div class="bg-balloon b4"></div>
        <div class="bg-balloon b5"></div>
        <div class="bg-balloon b6"></div>
        <div class="bg-balloon b7"></div>
        <div class="bg-balloon b8"></div>
        <div class="bg-balloon b9"></div>
        <div class="bg-balloon b10"></div>
        <div class="bg-balloon b11"></div>
        <div class="bg-balloon b12"></div>
        <div class="bg-balloon b13"></div>
        <div class="bg-balloon b14"></div>
    </div>

    <div class="card-wrapper">
        <div class="balloon-btn" id="balloonBtn" onclick="toggleReveal(event)">
            <!-- 질문 텍스트 -->
            <div class="title-text" id="questionText">
                아롱이와 다롱이의<br>성별은..?
            </div>

            <!-- 성별 공개 이모지 (보라색 하트 💜 및 남자아이 2명 👦🏻 👦🏻) -->
            <div class="reveal-content" id="revealContent">
                <span class="emoji">💜</span>
                <span class="emoji">👦🏻</span>
                <span class="emoji">👦🏻</span>
                <span class="emoji">💜</span>
            </div>

            <div class="balloon-tail"></div>
        </div>

        <div class="hint-capsule">
            풍선을 톡 눌러주세요
        </div>
    </div>

    <script>
        function toggleReveal(e) {
            const qText = document.getElementById('questionText');
            const rContent = document.getElementById('revealContent');

            if (rContent.style.display === 'flex') {
                rContent.style.display = 'none';
                qText.style.display = 'block';
            } else {
                qText.style.display = 'none';
                rContent.style.display = 'flex';

                // 풍선을 터뜨렸을 때 폭죽(컨페티) 효과 연출
                triggerConfetti();
            }
        }

        function triggerConfetti() {
            var count = 200;
            var defaults = {
                origin: { y: 0.6 }
            };

            function fire(particleRatio, opts) {
                confetti(Object.assign({}, defaults, opts, {
                    particleCount: Math.floor(count * particleRatio)
                }));
            }

            fire(0.25, {
                spread: 26,
                startVelocity: 55,
            });
            fire(0.2, {
                spread: 60,
            });
            fire(0.35, {
                spread: 100,
                decay: 0.91,
                scalar: 0.8
            });
            fire(0.1, {
                spread: 120,
                startVelocity: 25,
                decay: 0.92,
                scalar: 1.2
            });
            fire(0.1, {
                spread: 120,
                startVelocity: 45,
            });
        }
    </script>
</body>
</html>
