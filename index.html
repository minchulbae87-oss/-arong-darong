<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>아롱이와 다롱이의 성별은..?</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #f5f0fb;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* 배경 풍선 연출 */
        .bg-balloons {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
            background: radial-gradient(circle at 50% 50%, #ffffff 0%, #f3ebf9 100%);
        }

        .bg-balloon {
            position: absolute;
            border-radius: 50%;
            opacity: 0.7;
        }

        .bg-b1 { width: 90px; height: 110px; background: #85e3ff; top: 10%; left: 5%; border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%; }
        .bg-b2 { width: 80px; height: 100px; background: #b9b0ff; top: 18%; left: 25%; border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%; }
        .bg-b3 { width: 100px; height: 120px; background: #ffb3ba; top: 15%; right: 15%; border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%; }
        .bg-b4 { width: 85px; height: 105px; background: #baffc9; top: 30%; right: 5%; border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%; }
        .bg-b5 { width: 95px; height: 115px; background: #85e3ff; bottom: 15%; left: 8%; border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%; }
        .bg-b6 { width: 110px; height: 130px; background: #b9b0ff; bottom: 5%; right: -5%; border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%; }
        .bg-b7 { width: 75px; height: 95px; background: #ff7b9c; bottom: 12%; right: 40%; border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%; }

        /* 카드 메인 콘텐트 */
        .card-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 420px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* 중앙 중앙 풍선 버튼 */
        .balloon-btn {
            width: 320px;
            height: 380px;
            background: linear-gradient(135deg, #d3eaff 0%, #ffd4e5 100%);
            border-radius: 50% 50% 50% 50% / 45% 45% 55% 55%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 15px 35px rgba(180, 150, 200, 0.3), inset -10px -10px 20px rgba(255, 255, 255, 0.6);
            cursor: pointer;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            padding: 30px;
            text-align: center;
        }

        .balloon-btn:active {
            transform: scale(0.95);
        }

        .balloon-btn::after {
            content: '';
            position: absolute;
            bottom: -15px;
            width: 0;
            height: 0;
            border-left: 12px solid transparent;
            border-right: 12px solid transparent;
            border-bottom: 18px solid #f8b8d0;
        }

        .title-text {
            font-size: 26px;
            font-weight: 800;
            color: #5d4b70;
            line-height: 1.5;
            word-break: keep-all;
        }

        /* 공개 화면 (결과 연출) */
        .reveal-content {
            display: none;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: 12px;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .emoji {
            font-size: 50px;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.1));
        }

        @keyframes popIn {
            0% { transform: scale(0.3); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* 하단 안내 가이드 캡슐 */
        .hint-capsule {
            margin-top: 40px;
            background: rgba(255, 255, 255, 0.85);
            padding: 12px 28px;
            border-radius: 30px;
            font-size: 15px;
            font-weight: 600;
            color: #6a5b7b;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            backdrop-filter: blur(5px);
        }
    </style>
</head>
<body>

    <div class="bg-balloons">
        <div class="bg-balloon bg-b1"></div>
        <div class="bg-balloon bg-b2"></div>
        <div class="bg-balloon bg-b3"></div>
        <div class="bg-balloon bg-b4"></div>
        <div class="bg-balloon bg-b5"></div>
        <div class="bg-balloon bg-b6"></div>
        <div class="bg-balloon bg-b7"></div>
    </div>

    <div class="card-wrapper">
        <div class="balloon-btn" id="balloonBtn" onclick="toggleReveal()">
            <!-- 질문 텍스트 -->
            <div class="title-text" id="questionText">
                아롱이와 다롱이의<br>성별은..?
            </div>

            <!-- 성별 공개 이모지 (남자아이 2명으로 변경) -->
            <div class="reveal-content" id="revealContent">
                <span class="emoji">❤️</span>
                <span class="emoji">👦🏻</span>
                <span class="emoji">👦🏻</span>
                <span class="emoji">❤️</span>
            </div>
        </div>

        <div class="hint-capsule">
            풍선을 톡 눌러주세요
        </div>
    </div>

    <script>
        function toggleReveal() {
            const qText = document.getElementById('questionText');
            const rContent = document.getElementById('revealContent');

            if (rContent.style.display === 'flex') {
                rContent.style.display = 'none';
                qText.style.display = 'block';
            } else {
                qText.style.display = 'none';
                rContent.style.display = 'flex';
            }
        }
    </script>
</body>
</html>
